# ---------------------------------------------------------------------------
# Deploy the Bam Studio shop to Fly.io.
#
# WHAT THIS DOES
#   Every push to `master` (and any manual run from the Actions tab) hands the
#   repo to Fly, which builds the Docker image on its own remote builder and
#   rolls it out to the app defined in fly.toml — `bamstudio-shop`, region syd.
#   Nothing is built on this runner; see the --remote-only note further down.
#
# WHAT YOU MUST SET UP IN GITHUB FIRST
#   Repo → Settings → Secrets and variables → Actions
#
#   Secrets tab
#     FLY_API_TOKEN                  `fly tokens create deploy -a bamstudio-shop`
#     NEXT_PUBLIC_SUPABASE_ANON_KEY  Supabase → Project Settings → API Keys
#     SUPABASE_DB_URL                Supabase → Connect → Session pooler → URI,
#                                    with your database password pasted in.
#                                    This is what lets the deploy update the
#                                    database's tables before the new code goes
#                                    live. It is the most powerful value in this
#                                    repo — full read/write to every order and
#                                    customer address — so it is a Secret, never
#                                    a Variable, and it is used ONLY by the
#                                    migrate job, never passed to the build.
#                                    Full instructions, including which of
#                                    Supabase's connection strings to copy, are
#                                    at the top of migrate.yml.
#
#   Variables tab
#     NEXT_PUBLIC_SITE_URL           https://bamstudioshop.com
#     NEXT_PUBLIC_SUPABASE_URL       Supabase → Project Settings → API
#     NEXT_PUBLIC_SUPPORT_EMAIL      optional — needed for the contact form to reach you
#     NEXT_PUBLIC_ABN                optional — shown in the footer
#     NEXT_PUBLIC_GST_REGISTERED     optional — "true" only once you actually register
#     NEXT_PUBLIC_INSTAGRAM_URL      optional
#     NEXT_PUBLIC_TIKTOK_URL         optional
#
#   The anon key is a public value, but it is still a key, so it goes in
#   Secrets: GitHub masks secrets in build logs, and the rule "anything that
#   looks like a key goes in Secrets" is easier to follow than a case-by-case
#   judgement. Everything else here you would happily print on a business card.
#
# WHERE THE REAL SECRETS LIVE — NOT HERE
#   SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#   RESEND_API_KEY and EMAIL_FROM are set ONCE, directly on Fly:
#
#     fly secrets set STRIPE_SECRET_KEY=sk_live_... -a bamstudio-shop
#
#   They must never be added to this workflow. The NEXT_PUBLIC_* values below
#   are passed as Docker --build-arg, and build args are written into the
#   image's history — anyone who can pull the image can read them back. A
#   Stripe key passed that way is a leaked Stripe key.
#
#   (Fly secrets only exist at runtime, which is exactly why the NEXT_PUBLIC_*
#   values can't use them: Next inlines those into the browser bundle during
#   the build, long before a Fly secret is visible.)
#
# THE DATABASE IS CHANGED BEFORE THE CODE IS, AND ONLY IF IT SUCCEEDS
#   This workflow now has two jobs, in this order:
#
#     1. migrate  — runs .github/workflows/migrate.yml: applies any migration
#                   files the database has not run yet, then runs
#                   supabase/verify.sql and fails if a single assertion comes
#                   back false.
#     2. deploy   — `needs: migrate`, so it does not start at all unless job 1
#                   finished green. A failed migration means NO rollout: the
#                   shop keeps serving the version it was already serving.
#
#   That order — schema first, code second — is the only safe one, because a
#   new page that reads a column the database does not have is a 500 for a
#   customer, whereas a column nothing reads yet is harmless.
#
#   ⚠️ A RED ✗ ON THIS WORKFLOW IS NOT ALWAYS A BREAKAGE. The migrate job stops
#   for two different reasons and it says which, in a panel at the top of the
#   run page: "⏸️ Action needed" means everything works and it is waiting on
#   you (a backup confirmed, a setting added) and your database was not
#   touched; "❌ Migration failed" means something is genuinely wrong. Both are
#   red and both stop the rollout, because the only thing a green tick here may
#   ever mean is "the database and the code agree". Read the panel, not the
#   cross. The full reasoning is in scripts/migrate.sh under "WHEN IT REFUSES".
#
#   ⚠️ THE CONSEQUENCE YOU HAVE TO DESIGN FOR. Fly does a rolling deploy: for
#   about a minute the OLD code is still serving requests against the NEW
#   database. So every migration must be one the code that is ALREADY LIVE can
#   survive. In practice: only ADD things. Add a column, add a table, add a
#   function. Never drop or rename a column, or change what one means, in the
#   same release that stops using it — do that as two releases, weeks apart
#   ("expand, then migrate, then contract").
#
#   0005 and 0006 are safe under that rule and were read to check it. 0006 only
#   adds two new tables. 0005 adds two columns and one table, all additions.
#   The one thing in 0005 that is not a pure addition is `decrement_stock`: it
#   is dropped and recreated to return a number instead of nothing. The live
#   webhook calls it and ignores whatever comes back, so the change is
#   invisible to it, and the drop and the recreate are inside one transaction,
#   so there is no instant where the function is missing.
#
# Action reference and the deploy command follow Fly's own guide:
#   https://fly.io/docs/launch/continuous-deployment-with-github-actions/
# Fly's example uses @master; pinned to the @v1 tag here so a future change to
# the action can't alter a deploy without you choosing it.
# ---------------------------------------------------------------------------

name: Deploy to Fly.io

on:
  push:
    branches: [master]
  workflow_dispatch: # lets you deploy from the Actions tab without pushing

# Only ever one of these at a time, so two rollouts cannot race onto the same
# machine.
#
# `cancel-in-progress` was `true` — kill the older run when a newer push
# arrives. It is now `false`, and the reason is the migrate job. Cancelling a
# run now means cancelling a migration half-way through. The damage is bounded
# (each migration file runs in its own transaction, so a killed one rolls back
# and is not recorded as applied) but the result is a database part-way between
# two releases, and it is worth nothing to save four minutes of build time.
#
# `false` still prevents the race the old comment was worried about: a second
# push waits for the first to finish rather than running alongside it.
concurrency:
  group: deploy-bamstudio-shop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1 of 2
  # The database first. This calls .github/workflows/migrate.yml — the same
  # file the "Run migrations" button in the Actions tab runs, so there is one
  # description of how this database gets changed and not two that can drift.
  #
  # `secrets: inherit` hands it this repo's secrets; it uses exactly one,
  # SUPABASE_DB_URL.
  #
  # No `baseline` and no `ack_backup` here on purpose: the one-time baseline
  # and the one-time "I have taken a backup" are decisions a person makes,
  # from the Actions tab, once — not something a `git push` should be able to
  # do by accident.
  migrate:
    name: Database
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  # ---------------------------------------------------------------- 2 of 2
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # THIS LINE IS THE SAFETY. Without it, a migration that failed would be
    # followed by a rollout of code written for a database that does not exist.
    needs: migrate

    # Read once here, used by both steps below. Referenced as shell variables
    # rather than pasted into the commands, so an odd character in a value
    # can't turn into part of the command.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_ABN: ${{ vars.NEXT_PUBLIC_ABN }}
      NEXT_PUBLIC_GST_REGISTERED: ${{ vars.NEXT_PUBLIC_GST_REGISTERED }}
      NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
      NEXT_PUBLIC_TIKTOK_URL: ${{ vars.NEXT_PUBLIC_TIKTOK_URL }}

    steps:
      - uses: actions/checkout@v5

      # Catch a missing setting here, by name, in three lines of log — instead
      # of thirty screens into a Next build failure. NEXT_PUBLIC_SITE_URL in
      # particular is read at module scope by app/layout.tsx and throws when
      # blank, which surfaces as a stack trace blaming the layout file.
      - name: Check the required settings exist
        shell: bash
        run: |
          missing=0
          check() { # check <NAME> <Secrets|Variables>
            if [ -z "${!1}" ]; then
              echo "MISSING: $1 — add it under Settings → Secrets and variables → Actions → $2"
              missing=1
            fi
          }

          check FLY_API_TOKEN                 Secrets
          check NEXT_PUBLIC_SUPABASE_ANON_KEY Secrets
          check NEXT_PUBLIC_SITE_URL          Variables
          check NEXT_PUBLIC_SUPABASE_URL      Variables

          if [ "$missing" = 1 ]; then
            echo
            echo "Deploy stopped: add the setting(s) named above, then re-run this workflow."
            exit 1
          fi

          # Optional — blank is a valid choice, just say so out loud.
          for name in NEXT_PUBLIC_SUPPORT_EMAIL NEXT_PUBLIC_ABN \
                      NEXT_PUBLIC_GST_REGISTERED NEXT_PUBLIC_INSTAGRAM_URL \
                      NEXT_PUBLIC_TIKTOK_URL; do
            [ -n "${!name}" ] || echo "Note: $name is blank — the site runs without it. See .env.example for what each one changes."
          done

          echo "All required settings are present."

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # --remote-only builds the image on Fly's builder, not this runner.
      # `next build` peaks around 1.6 GB, and this is the same path `fly deploy`
      # takes when you run it by hand — so CI and your laptop build identically.
      #
      # The app name and region come from fly.toml, so there is only ever one
      # place to change them.
      - name: Deploy
        run: |
          flyctl deploy --remote-only \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL="$NEXT_PUBLIC_SUPPORT_EMAIL" \
            --build-arg NEXT_PUBLIC_ABN="$NEXT_PUBLIC_ABN" \
            --build-arg NEXT_PUBLIC_GST_REGISTERED="$NEXT_PUBLIC_GST_REGISTERED" \
            --build-arg NEXT_PUBLIC_INSTAGRAM_URL="$NEXT_PUBLIC_INSTAGRAM_URL" \
            --build-arg NEXT_PUBLIC_TIKTOK_URL="$NEXT_PUBLIC_TIKTOK_URL"
